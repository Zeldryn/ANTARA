<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Linimasa eksplorasi Merkurius</title><desc id="d">Linimasa Mariner 10, MESSENGER dan BepiColombo.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17212c"/><stop offset="1" stop-color="#050911"/></linearGradient></defs><rect width="1200" height="900" fill="url(#bg)"/><text x="90" y="110" fill="#d8c184" font-family="Arial,sans-serif" font-size="28" letter-spacing="5">EKSPLORASI MERKURIUS</text><line x1="155" y1="440" x2="1045" y2="440" stroke="#8c7b4e" stroke-width="5"/><g font-family="Arial,sans-serif"><g transform="translate(245 440)"><circle r="22" fill="#d5bf83"/><line y1="-22" y2="-155" stroke="#d5bf83" stroke-width="3"/><text y="-190" text-anchor="middle" fill="#fff" font-size="33" font-weight="700">MARINER 10</text><text y="-150" text-anchor="middle" fill="#aab5be" font-size="22">1974-1975</text><text y="80" text-anchor="middle" fill="#8fa0ad" font-size="20">3 flyby</text></g><g transform="translate(600 440)"><circle r="22" fill="#d5bf83"/><line y1="22" y2="155" stroke="#d5bf83" stroke-width="3"/><text y="205" text-anchor="middle" fill="#fff" font-size="33" font-weight="700">MESSENGER</text><text y="245" text-anchor="middle" fill="#aab5be" font-size="22">2011-2015</text><text y="285" text-anchor="middle" fill="#8fa0ad" font-size="20">orbiter pertama</text></g><g transform="translate(955 440)"><circle r="22" fill="#d5bf83"/><line y1="-22" y2="-155" stroke="#d5bf83" stroke-width="3"/><text y="-190" text-anchor="middle" fill="#fff" font-size="33" font-weight="700">BEPICOLOMBO</text><text y="-150" text-anchor="middle" fill="#aab5be" font-size="22">2018-2027</text><text y="80" text-anchor="middle" fill="#8fa0ad" font-size="20">ESA / JAXA</text></g></g><text x="600" y="820" text-anchor="middle" fill="#7f919f" font-family="Arial,sans-serif" font-size="21">Dari lintasan dekat menuju pemetaan global dan studi dua-orbiter</text></svg>
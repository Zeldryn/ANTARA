<svg aria-labelledby="t d" role="img" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg"><title id="t">Linimasa eksplorasi Merkurius</title><desc id="d">Linimasa Mariner 10, MESSENGER dan BepiColombo.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17212c"/><stop offset="1" stop-color="#050911"/></linearGradient></defs><rect fill="url(#bg)" height="900" width="1200"/><text fill="#d8c184" font-family="Arial,sans-serif" font-size="28" letter-spacing="5" x="90" y="110">EKSPLORASI MERKURIUS</text><line stroke="#8c7b4e" stroke-width="5" x1="155" x2="1045" y1="440" y2="440"/><g font-family="Arial,sans-serif"><g transform="translate(245 440)"><circle fill="#d5bf83" r="22"/><line stroke="#d5bf83" stroke-width="3" y1="-22" y2="-155"/><text fill="#fff" font-size="33" font-weight="700" text-anchor="middle" y="-190">MARINER 10</text><text fill="#aab5be" font-size="22" text-anchor="middle" y="-150">1974-1975</text><text fill="#8fa0ad" font-size="20" text-anchor="middle" y="80">3 terbang lewat dekat</text></g><g transform="translate(600 440)"><circle fill="#d5bf83" r="22"/><line stroke="#d5bf83" stroke-width="3" y1="22" y2="155"/><text fill="#fff" font-size="33" font-weight="700" text-anchor="middle" y="205">MESSENGER</text><text fill="#aab5be" font-size="22" text-anchor="middle" y="245">2011-2015</text><text fill="#8fa0ad" font-size="20" text-anchor="middle" y="285">orbiter pertama</text></g><g transform="translate(955 440)"><circle fill="#d5bf83" r="22"/><line stroke="#d5bf83" stroke-width="3" y1="-22" y2="-155"/><text fill="#fff" font-size="33" font-weight="700" text-anchor="middle" y="-190">BEPICOLOMBO</text><text fill="#aab5be" font-size="22" text-anchor="middle" y="-150">2018 → 2026</text><text fill="#8fa0ad" font-size="20" text-anchor="middle" y="80">ESA / JAXA</text></g></g><text fill="#7f919f" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" x="600" y="820">Dari terbang lewat dekat, orbiter pertama, hingga kedatangan BepiColo
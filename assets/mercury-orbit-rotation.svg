<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="title desc" role="img" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
<title id="title">Jalur mengelilingi dan pola gerak khusus putaran Merkurius</title>
<desc id="desc">Diagram edukasi yang menunjukkan jalur mengelilingi Merkurius selama 88 hari dan pola gerak khusus spin jalur mengelilingi tiga banding dua dengan putaran sidereal sekitar 59 hari.</desc>
<defs>
<radialGradient cx="50%" cy="45%" id="bg" r="75%"><stop offset="0" stop-color="#1a2430"/><stop offset="1" stop-color="#050911"/></radialGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fff4bf"/><stop offset="0.5" stop-color="#e9b75a"/><stop offset="1" stop-color="#a65a24"/></radialGradient>
<radialGradient id="mercury"><stop offset="0" stop-color="#a6a39c"/><stop offset="0.7" stop-color="#66645f"/><stop offset="1" stop-color="#2c2d30"/></radialGradient>
<filter id="glow"><feGaussianBlur result="b" stdDeviation="12"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect fill="url(#bg)" height="760" width="1200"/>
<g fill="#dbe8ff" opacity=".45">
<circle cx="106" cy="104" r="2"/><circle cx="211" cy="154" r="1.6"/><circle cx="974" cy="115" r="1.8"/><circle cx="1090" cy="242" r="1.4"/><circle cx="912" cy="610" r="1.7"/><circle cx="135" cy="594" r="1.4"/>
</g>
<ellipse cx="600" cy="382" fill="none" opacity=".55" rx="410" ry="235" stroke="#bca66f" stroke-width="3"/>
<ellipse cx="600" cy="382" fill="none" opacity=".48" rx="410" ry="235" stroke="#d7c18a" stroke-dasharray="9 13" stroke-width="1"/>
<circle cx="600" cy="382" fill="url(#sun)" filter="url(#glow)" r="72"/>
<text fill="#f1dfad" font-family="Arial,sans-serif" font-size="26" letter-spacing="5" text-anchor="middle" x="600" y="490">MATAHARI</text>
<g transform="translate(960 272)">
<circle fill="url(#mercury)" r="48" stroke="#c8c0af" stroke-width="2"/>
<g fill="none" opacity=".8" stroke="#464640" stroke-width="3"><circle cx="-15" cy="-10" r="10"/><circle cx="13" cy="14" r="14"/><circle cx="19" cy="-17" r="7"/><circle cx="-24" cy="21" r="6"/></g>
<path d="M-8 -76 A78 78 0 1 1 -55 -55" fill="none" stroke="#8fc7d9" stroke-linecap="round" stroke-width="4"/>
<path d="M-58 -66 l4 18 13-12" fill="#8fc7d9"/>
</g>
<text fill="#e8e5dd" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="960" y="352">MERKURIUS</text>
<g font-family="Arial,sans-serif">
<rect fill="#0b111b" height="162" opacity=".92" rx="20" stroke="#8c7b4e" stroke-width="2" width="350" x="76" y="72"/>
<text fill="#cbb77b" font-size="18" letter-spacing="3" x="108" y="118">PERIODE JALUR MENGELILINGI</text>
<text fill="#ffffff" font-size="48" font-weight="700" x="108" y="172">~88 hari</text>
<text fill="#9eb0c0" font-size="19" x="108" y="205">satu tahun Merkurius</text>
<rect fill="#0b111b" height="168" opacity=".92" rx="20" stroke="#8c7b4e" stroke-width="2" width="350" x="774" y="510"/>
<text fill="#cbb77b" font-size="18" letter-spacing="3" x="806" y="556">PUTARAN SIDEREAL</text>
<text fill="#ffffff" font-size="48" font-weight="700" x="806" y="610">~59 hari</text>
<text fill="#9eb0c0" font-size="19" x="806" y="643">pola gerak khusus</text>
<text fill="#8293a3" font-size="17" text-anchor="middle" x="600" y="716">3 putaran pada sumbu untuk setiap 2 jalur mengelilingi mengelilingi Matahari</text>
</g>
</svg>
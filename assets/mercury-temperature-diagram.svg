<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Kontras suhu Merkurius</title><desc id="d">Diagram edukasi sisi siang dan malam Merkurius dengan suhu sekitar 430 derajat Celsius dan minus 180 derajat Celsius.</desc><defs><radialGradient id="bg"><stop stop-color="#16202a"/><stop offset="1" stop-color="#050911"/></radialGradient><linearGradient id="p"><stop stop-color="#c8c3b7"/><stop offset=".49" stop-color="#7c7972"/><stop offset=".51" stop-color="#2c2f34"/><stop offset="1" stop-color="#12171e"/></linearGradient></defs><rect width="1200" height="900" fill="url(#bg)"/><circle cx="600" cy="440" r="250" fill="url(#p)" stroke="#b6aa8c" stroke-width="3"/><g fill="none" stroke="#50504c" stroke-width="7" opacity=".65"><circle cx="500" cy="330" r="42"/><circle cx="690" cy="385" r="58"/><circle cx="530" cy="520" r="31"/><circle cx="735" cy="555" r="27"/><circle cx="615" cy="260" r="24"/></g><path d="M600 190v500" stroke="#d7c18a" stroke-width="3" stroke-dasharray="10 12" opacity=".75"/><text x="335" y="155" fill="#d8bd77" font-family="Arial,sans-serif" font-size="26" letter-spacing="4">SISI SIANG</text><text x="865" y="155" text-anchor="end" fill="#99b9d4" font-family="Arial,sans-serif" font-size="26" letter-spacing="4">SISI MALAM</text><text x="335" y="790" fill="#fff1cf" font-family="Arial,sans-serif" font-size="74" font-weight="700">~430°C</text><text x="865" y="790" text-anchor="end" fill="#d8ebff" font-family="Arial,sans-serif" font-size="74" font-weight="700">~-180°C</text><text x="600" y="845" text-anchor="middle" fill="#8fa0ad" font-family="Arial,sans-serif" font-size="24">Hampir tanpa atmosfer tebal untuk menyimpan dan menyebarkan panas</text></svg>
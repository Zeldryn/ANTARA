<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d">
  <title id="t">Diagram angin cepat Neptunus</title>
  <desc id="d">Ilustrasi sederhana yang menunjukkan arus angin sangat cepat di atmosfer Neptunus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#071022"/><stop offset="1" stop-color="#16387a"/></linearGradient>
    <radialGradient id="planet" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#a6c4ff"/><stop offset="0.45" stop-color="#618df5"/><stop offset="1" stop-color="#2749ad"/></radialGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>
  <circle cx="320" cy="310" r="150" fill="url(#planet)"/>
  <g fill="none" stroke="#e4edff" stroke-width="8" stroke-linecap="round" opacity="0.82">
    <path d="M180 240 C250 205, 380 205, 455 238"/>
    <path d="M170 300 C255 260, 385 265, 470 300"/>
    <path d="M182 362 C255 328, 380 330, 452 365"/>
  </g>
  <g fill="#e4edff">
    <polygon points="450,238 430,229 434,247"/>
    <polygon points="470,300 448,291 452,309"/>
    <polygon points="452,365 431,356 435,374"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#edf3ff">
    <text x="520" y="122" font-size="34" font-weight="700">Angin Super Cepat di Neptunus</text>
    <text x="520" y="162" font-size="22" fill="#c6d6ff">Neptunus memiliki angin tercepat di antara planet-planet utama.</text>
    <text x="520" y="252" font-size="54" font-weight="700" fill="#ffe68f">&gt; 2.000 km/jam</text>
    <text x="520" y="290" font-size="20" fill="#d7e2ff">perkiraan puncak kecepatan arus atmosfer</text>
    <text x="520" y="356" font-size="18" fill="#d7e2ff">Awan terang membantu ilmuwan melacak arah dan laju angin.</text>
    <text x="520" y="390" font-size="18" fill="#d7e2ff">Meski jauh dari Matahari, atmosfer Neptunus tetap sangat aktif.</text>
  </g>
</svg>

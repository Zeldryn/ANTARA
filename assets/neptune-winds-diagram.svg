<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="t d" role="img" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
<title id="t">Diagram angin cepat Neptunus</title>
<desc id="d">Ilustrasi sederhana yang menunjukkan arus angin sangat cepat di udara Neptunus.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#071022"/><stop offset="1" stop-color="#16387a"/></linearGradient>
<radialGradient cx="45%" cy="35%" id="planet" r="70%"><stop offset="0" stop-color="#a6c4ff"/><stop offset="0.45" stop-color="#618df5"/><stop offset="1" stop-color="#2749ad"/></radialGradient>
</defs>
<rect fill="url(#bg)" height="600" width="900"/>
<circle cx="320" cy="310" fill="url(#planet)" r="150"/>
<g fill="none" opacity="0.82" stroke="#e4edff" stroke-linecap="round" stroke-width="8">
<path d="M180 240 C250 205, 380 205, 455 238"/>
<path d="M170 300 C255 260, 385 265, 470 300"/>
<path d="M182 362 C255 328, 380 330, 452 365"/>
</g>
<g fill="#e4edff">
<polygon points="450,238 430,229 434,247"/>
<polygon points="470,300 448,291 452,309"/>
<polygon points="452,365 431,356 435,374"/>
</g>
<g fill="#edf3ff" font-family="Arial, Helvetica, sans-serif">
<text font-size="34" font-weight="700" x="520" y="122">Angin Super Cepat di Neptunus</text>
<text fill="#c6d6ff" font-size="22" x="520" y="162">Neptunus punya angin tercepat di antara planet-planet utama.</text>
<text fill="#ffe68f" font-size="54" font-weight="700" x="520" y="252">&gt; 2.000 km/jam</text>
<text fill="#d7e2ff" font-size="20" x="520" y="290">perkiraan puncak kecepatan arus udara</text>
<text fill="#d7e2ff" font-size="18" x="520" y="356">Awan terang membantu ilmuwan melacak arah dan laju angin.</text>
<text fill="#d7e2ff" font-size="18" x="520" y="390">Meski jauh dari Matahari, udara Neptunus tetap sangat aktif.</text>
</g>
</svg>
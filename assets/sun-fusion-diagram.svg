<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="t d" role="img" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg">
<title id="t">Diagram cara Matahari membuat energi di inti Matahari</title><desc id="d">Rangkaian sederhana proton-proton yang mengubah gas ringan bernama hidrogen menjadi gas ringan bernama helium dan melepaskan energi.</desc>
<defs><radialGradient id="bg"><stop stop-color="#18243a"/><stop offset="1" stop-color="#040913"/></radialGradient><radialGradient id="core"><stop stop-color="#fff7c8"/><stop offset=".35" stop-color="#ffd66f"/><stop offset="1" stop-color="#e45c22"/></radialGradient><filter id="glow"><feGaussianBlur result="b" stdDeviation="12"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect fill="url(#bg)" height="620" width="960"/><circle cx="480" cy="300" fill="none" r="205" stroke="#f7c25c" stroke-opacity=".18"/><circle cx="480" cy="300" fill="url(#core)" filter="url(#glow)" opacity=".12" r="145"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text fill="#f0d89b" font-size="18" letter-spacing="5" x="480" y="58">ENERGI INTI MATAHARI</text><text fill="#8290a5" font-size="13" letter-spacing="2" x="480" y="90">RANTAI PROTON-PROTON, ILUSTRASI EDUKASI</text></g>
<g fill="none" opacity=".7" stroke="#f4c96e" stroke-width="2"><path d="M230 300h145"/><path d="M585 300h145"/></g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<g transform="translate(160 300)"><circle fill="#f0aa48" fill-opacity=".18" r="46" stroke="#f0aa48"/><circle cx="-13" cy="-8" fill="#fff1c2" r="10"/><circle cx="12" cy="8" fill="#ffd46d" r="10"/><text fill="#e7e3d9" font-size="18" y="82">GAS HIDROGEN</text><text fill="#8f9bad" font-size="12" y="106">proton bergabung</text></g>
<g transform="translate(480 300)"><circle fill="#ff9a35" fill-opacity=".18" r="92" stroke="#ffb84e"/><circle cx="-22" cy="-18" fill="#fff2bd" r="15"/><circle cx="22" cy="-18" fill="#ffd16a" r="15"/><circle cx="-22" cy="22" fill="#ffbd53" r="15"/><circle cx="22" cy="22" fill="#fff0b0" r="15"/><text fill="#f3d79b" font-size="18" y="132">INTI, ~15 JUTA C</text><text fill="#8f9bad" font-size="12" y="157">tekanan dan suhu memungkinkan cara Matahari membuat energi</text></g>
<g transform="translate(800 300)"><circle fill="#ffd875" fill-opacity=".16" r="46" stroke="#ffd875"/><circle cx="-12" cy="-12" fill="#fff4c8" r="10"/><circle cx="12" cy="-12" fill="#ffe487" r="10"/><circle cx="-12" cy="12" fill="#ffca5f" r="10"/><circle cx="12" cy="12" fill="#fff0aa" r="10"/><text fill="#e7e3d9" font-size="18" y="82">GAS HELIUM + ENERGI</text><text fill="#8f9bad" font-size="12" y="106">massa kecil berubah menjadi energi</text></g>
<text fill="#a6afbd" font-size="13" x="480" y="545">Cara Matahari membuat energi menopang luminositas Matahari sekitar 3.83 x 10^26 watt.</text><text fill="#6f7b8d" font-size="11" x="480" y="570">Skema disederhanakan untuk pembelajaran. Data: NASA Science.</text>
</g></svg>
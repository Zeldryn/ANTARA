<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t d">
<title id="t">Diagram fusi nuklir di inti Matahari</title><desc id="d">Rangkaian sederhana proton-proton yang mengubah hidrogen menjadi helium dan melepaskan energi.</desc>
<defs><radialGradient id="bg"><stop stop-color="#18243a"/><stop offset="1" stop-color="#040913"/></radialGradient><radialGradient id="core"><stop stop-color="#fff7c8"/><stop offset=".35" stop-color="#ffd66f"/><stop offset="1" stop-color="#e45c22"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="960" height="620" fill="url(#bg)"/><circle cx="480" cy="300" r="205" fill="none" stroke="#f7c25c" stroke-opacity=".18"/><circle cx="480" cy="300" r="145" fill="url(#core)" opacity=".12" filter="url(#glow)"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="480" y="58" fill="#f0d89b" font-size="18" letter-spacing="5">ENERGI INTI MATAHARI</text><text x="480" y="90" fill="#8290a5" font-size="13" letter-spacing="2">RANTAI PROTON-PROTON, ILUSTRASI EDUKASI</text></g>
<g stroke="#f4c96e" stroke-width="2" fill="none" opacity=".7"><path d="M230 300h145"/><path d="M585 300h145"/></g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<g transform="translate(160 300)"><circle r="46" fill="#f0aa48" fill-opacity=".18" stroke="#f0aa48"/><circle cx="-13" cy="-8" r="10" fill="#fff1c2"/><circle cx="12" cy="8" r="10" fill="#ffd46d"/><text y="82" fill="#e7e3d9" font-size="18">HIDROGEN</text><text y="106" fill="#8f9bad" font-size="12">proton bergabung</text></g>
<g transform="translate(480 300)"><circle r="92" fill="#ff9a35" fill-opacity=".18" stroke="#ffb84e"/><circle cx="-22" cy="-18" r="15" fill="#fff2bd"/><circle cx="22" cy="-18" r="15" fill="#ffd16a"/><circle cx="-22" cy="22" r="15" fill="#ffbd53"/><circle cx="22" cy="22" r="15" fill="#fff0b0"/><text y="132" fill="#f3d79b" font-size="18">INTI, ~15 JUTA C</text><text y="157" fill="#8f9bad" font-size="12">tekanan dan suhu memungkinkan fusi</text></g>
<g transform="translate(800 300)"><circle r="46" fill="#ffd875" fill-opacity=".16" stroke="#ffd875"/><circle cx="-12" cy="-12" r="10" fill="#fff4c8"/><circle cx="12" cy="-12" r="10" fill="#ffe487"/><circle cx="-12" cy="12" r="10" fill="#ffca5f"/><circle cx="12" cy="12" r="10" fill="#fff0aa"/><text y="82" fill="#e7e3d9" font-size="18">HELIUM + ENERGI</text><text y="106" fill="#8f9bad" font-size="12">massa kecil berubah menjadi energi</text></g>
<text x="480" y="545" fill="#a6afbd" font-size="13">Fusi menopang luminositas Matahari sekitar 3.83 x 10^26 watt.</text><text x="480" y="570" fill="#6f7b8d" font-size="11">Skema disederhanakan untuk pembelajaran. Data: NASA Science.</text>
</g></svg>

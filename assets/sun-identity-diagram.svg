<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="t d" role="img" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
<title id="t">Skala dan identitas Matahari</title><desc id="d">Diagram edukasi ANTARA yang menunjukkan Matahari sebagai bintang G2 V, diameter sekitar 1,4 juta kilometer, dan pusat tarikan Tata Surya.</desc>
<defs><radialGradient cx="38%" cy="34%" id="sun"><stop stop-color="#fff8c8"/><stop offset=".28" stop-color="#ffd866"/><stop offset=".68" stop-color="#f59c2f"/><stop offset="1" stop-color="#c95b24"/></radialGradient><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#02050a"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="14"/></filter></defs>
<rect fill="url(#bg)" height="720" rx="42" width="1200"/><g fill="#b9ddff" opacity=".35"><circle cx="92" cy="110" r="2"/><circle cx="1074" cy="102" r="1.5"/><circle cx="1024" cy="606" r="2"/><circle cx="180" cy="592" r="1"/></g>
<circle cx="390" cy="360" fill="#f29c2f" filter="url(#g)" opacity=".22" r="224"/><circle cx="390" cy="360" fill="url(#sun)" r="188"/><g fill="#7b3d20" opacity=".7"><ellipse cx="340" cy="315" rx="22" ry="11" transform="rotate(-18 340 315)"/><ellipse cx="482" cy="408" rx="16" ry="8" transform="rotate(22 482 408)"/></g>
<g fill="#f4f7fb" font-family="Inter,Arial,sans-serif"><text fill="#d4b878" font-size="28" letter-spacing="5" x="684" y="204">BINTANG DERET UTAMA</text><text font-family="Georgia,serif" font-size="66" x="684" y="272">Matahari</text><text fill="#b7c4d4" font-size="26" x="684" y="326">Tipe spektral G2 V · usia sekitar 4,5 miliar tahun</text><line stroke="#d4b878" stroke-opacity=".5" x1="684" x2="1084" y1="370" y2="370"/><text fill="#d4b878" font-size="24" x="684" y="430">DIAMETER</text><text font-size="24" x="850" y="430">≈ 1,4 juta km</text><text fill="#d4b878" font-size="24" x="684" y="486">JARAK BUMI</text><text font-size="24" x="850" y="486">≈ 150 juta km</text><text fill="#d4b878" font-size="24" x="684" y="542">PERAN</text><text font-size="24" x="850" y="542">99,8% isi Tata Surya</text></g>
<text fill="#aab8c9" font-family="Inter,Arial,sans-serif" font-size="18" letter-spacing="3" text-anchor="middle" x="390" y="630">ILUSTRASI SKALA · DATA NASA</text></svg>
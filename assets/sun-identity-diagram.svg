<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Skala dan identitas Matahari</title><desc id="d">Diagram edukasi ANTARA yang menunjukkan Matahari sebagai bintang G2 V, diameter sekitar 1,4 juta kilometer, dan pusat gravitasi Tata Surya.</desc>
<defs><radialGradient id="sun" cx="38%" cy="34%"><stop stop-color="#fff8c8"/><stop offset=".28" stop-color="#ffd866"/><stop offset=".68" stop-color="#f59c2f"/><stop offset="1" stop-color="#c95b24"/></radialGradient><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#02050a"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="14"/></filter></defs>
<rect width="1200" height="720" rx="42" fill="url(#bg)"/><g opacity=".35" fill="#b9ddff"><circle cx="92" cy="110" r="2"/><circle cx="1074" cy="102" r="1.5"/><circle cx="1024" cy="606" r="2"/><circle cx="180" cy="592" r="1"/></g>
<circle cx="390" cy="360" r="224" fill="#f29c2f" opacity=".22" filter="url(#g)"/><circle cx="390" cy="360" r="188" fill="url(#sun)"/><g fill="#7b3d20" opacity=".7"><ellipse cx="340" cy="315" rx="22" ry="11" transform="rotate(-18 340 315)"/><ellipse cx="482" cy="408" rx="16" ry="8" transform="rotate(22 482 408)"/></g>
<g font-family="Inter,Arial,sans-serif" fill="#f4f7fb"><text x="684" y="204" font-size="28" letter-spacing="5" fill="#d4b878">BINTANG DERET UTAMA</text><text x="684" y="272" font-size="66" font-family="Georgia,serif">Matahari</text><text x="684" y="326" font-size="26" fill="#b7c4d4">Tipe spektral G2 V · usia sekitar 4,5 miliar tahun</text><line x1="684" y1="370" x2="1084" y2="370" stroke="#d4b878" stroke-opacity=".5"/><text x="684" y="430" font-size="24" fill="#d4b878">DIAMETER</text><text x="850" y="430" font-size="24">≈ 1,4 juta km</text><text x="684" y="486" font-size="24" fill="#d4b878">JARAK BUMI</text><text x="850" y="486" font-size="24">≈ 150 juta km</text><text x="684" y="542" font-size="24" fill="#d4b878">PERAN</text><text x="850" y="542" font-size="24">99,8% massa Tata Surya</text></g>
<text x="390" y="630" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" letter-spacing="3" fill="#aab8c9">ILUSTRASI SKALA · DATA NASA</text></svg>

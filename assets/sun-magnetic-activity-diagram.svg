<svg aria-labelledby="t d" role="img" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg"><title id="t">Aktivitas magnet Matahari</title><desc id="d">Diagram edukasi yang memperlihatkan garis gaya magnet, lengkungan gas panas, ledakan cahaya Matahari, dan SEMBURAN BESAR DARI MATAHARI dari daerah aktif Matahari.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#04070d"/><stop offset="1" stop-color="#120805"/></linearGradient><radialGradient id="s"><stop stop-color="#fff3ae"/><stop offset=".56" stop-color="#f6a038"/><stop offset="1" stop-color="#b64622"/></radialGradient><filter id="gl"><feGaussianBlur stdDeviation="8"/></filter></defs><rect fill="url(#bg)" height="720" rx="42" width="1200"/><path d="M120 520C245 350 490 345 620 520" fill="none" filter="url(#gl)" opacity=".16" stroke="#ffb24f" stroke-width="32"/><path d="M150 522C270 368 470 364 590 522" fill="none" stroke="#ffbc5a" stroke-width="8"/><path d="M218 510C282 326 462 320 525 510" fill="none" stroke="#f46845" stroke-width="5"/><path d="M275 507C320 392 423 390 468 507" fill="none" stroke="#ffe19c" stroke-width="3"/><path d="M102 548h560a280 280 0 0 0-560 0z" fill="url(#s)"/><ellipse cx="333" cy="520" fill="#6a2c1f" rx="38" ry="14"/><path d="M520 420c80-66 144-45 205-4 48 32 98 37 152 5" fill="none" opacity=".75" stroke="#ffd18b" stroke-width="8"/><path d="M533 398c86-88 170-62 239-15 55 38 111 42 180 4" fill="none" opacity=".7" stroke="#ff774d" stroke-width="4"/><g fill="#ffb760"><circle cx="807" cy="384" r="8"/><circle cx="861" cy="405" r="5"/><circle cx="920" cy="385" r="3"/></g>
<g font-family="Inter,Arial,sans-serif"><text fill="#d4b878" font-size="25" letter-spacing="4" x="704" y="168">GAYA MAGNET</text><text fill="#fff" font-family="Georgia,serif" font-size="54" x="704" y="228">Aktivitas Surya</text><text fill="#bac5d1" font-size="23" x="704" y="294">Gas superpanas bermuatan mengikuti gaya magnet yang terus berubah.</text><text fill="#f0f4f8" font-size="24" x="704" y="382">01 · Lengkungan gas panas membentuk loop gas superpanas.</text><text fill="#f0f4f8" font-size="24" x="704" y="434">02 · Ledakan cahaya Matahari melepaskan energi secara lokal.</text><text fill="#f0f4f8" font-size="24" x="704" y="486">03 · SEMBURAN BESAR DARI MATAHARI bisa mengirim gas superpanas ke ruang antarplanet.</text><text fill="#8fa0b4" font-size="18" letter-spacing="2" x="704" y="592">DIAGRAM KONSEPTUAL · NASA ILMU TENTANG MATAHARI</text></g></svg>
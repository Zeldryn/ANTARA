<g font-family="Inter,Arial,sans-serif"><text x="690" y="174" font-size="26" fill="#d4b878" letter-spacing="4">FOTOSFER</text><text x="690" y="236" font-size="56" font-family="Georgia,serif" fill="#fff">Permukaan yang Dinamis</text><text x="690" y="298" font-size="23" fill="#bac5d1">Yang terlihat bukan tanah padat, melainkan plasma bercahaya.</text><g font-size="25" fill="#eef3f8"><circle cx="712" cy="378" r="7" fill="#e7bc68"/><text x="742" y="387">Granulasi berasal dari konveksi plasma.</text><circle cx="712" cy="440" r="7" fill="#e7bc68"/><text x="742" y="449">Sunspot lebih dingin dan terkait medan magnet kuat.</text><circle cx="712" cy="502" r="7" fill="#e7bc68"/><text x="742" y="511">Daerah aktif dapat memicu flare dan CME.</text></g><text x="690" y="604" font-size="18" fill="#8fa0b4" letter-spacing="2">DIAGRAM KONSEPTUAL · NASA HELIOPHYSICS</text></g></svg>

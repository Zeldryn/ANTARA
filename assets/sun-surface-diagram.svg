<g font-family="Inter,Arial,sans-serif"><text fill="#d4b878" font-size="26" letter-spacing="4" x="690" y="174">BAGIAN TERANG MATAHARI YANG KITA LIHAT</text><text fill="#fff" font-family="Georgia,serif" font-size="56" x="690" y="236">Permukaan yang Yang terus berubah</text><text fill="#bac5d1" font-size="23" x="690" y="298">Yang terlihat bukan tanah padat, melainkan gas superpanas bercahaya.</text><g fill="#eef3f8" font-size="25"><circle cx="712" cy="378" fill="#e7bc68" r="7"/><text x="742" y="387">Pola bintik kecil berasal dari gerakan panas naik dan turun gas superpanas.</text><circle cx="712" cy="440" fill="#e7bc68" r="7"/><text x="742" y="449">Bintik Matahari lebih dingin dan terkait gaya magnet kuat.</text><circle cx="712" cy="502" fill="#e7bc68" r="7"/><text x="742" y="511">Daerah aktif bisa memicu ledakan cahaya Matahari dan SEMBURAN BESAR DARI MATAHARI.</text></g><text fill="#8fa0b4" font-size="18" letter-spacing="2" x="690" y="604">DIAGRAM KONSEPTUAL · NASA ILMU TENTANG MATAHARI</text></g></svg>
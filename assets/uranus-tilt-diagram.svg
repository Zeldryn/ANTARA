<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d">
  <title id="t">Diagram kemiringan sumbu Uranus</title>
  <desc id="d">Ilustrasi sederhana yang memperlihatkan Uranus dengan sumbu rotasi 97,77 derajat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07121a"/><stop offset="1" stop-color="#112733"/></linearGradient>
    <radialGradient id="planet" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#c2ffff"/><stop offset="0.55" stop-color="#96dde0"/><stop offset="1" stop-color="#4e9da6"/></radialGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>
  <g opacity="0.5" stroke="#d9edf0" stroke-dasharray="10 10"><line x1="150" y1="300" x2="750" y2="300"/></g>
  <g>
    <circle cx="450" cy="300" r="140" fill="url(#planet)"/>
    <ellipse cx="450" cy="300" rx="200" ry="48" fill="none" stroke="#c7edf0" stroke-width="6" opacity="0.35"/>
    <line x1="390" y1="118" x2="510" y2="482" stroke="#f7f5d6" stroke-width="8"/>
    <polygon points="390,118 378,148 406,142" fill="#f7f5d6"/>
    <polygon points="510,482 498,452 526,458" fill="#f7f5d6"/>
    <path d="M552 236 A120 120 0 0 1 578 356" fill="none" stroke="#ffd27a" stroke-width="7"/>
    <polygon points="585,352 569,344 572,363" fill="#ffd27a"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#edf8f8">
    <text x="72" y="88" font-size="34" font-weight="700">Kemiringan Sumbu Uranus</text>
    <text x="72" y="128" font-size="22" fill="#b8d7db">Uranus berputar hampir menyamping terhadap bidang orbitnya.</text>
    <text x="605" y="294" font-size="44" font-weight="700" fill="#ffe299">97,77°</text>
    <text x="604" y="326" font-size="18" fill="#cfe8ea">kemiringan sumbu rotasi</text>
    <text x="150" y="284" font-size="18" fill="#cfe8ea">bidang orbit (acuan sederhana)</text>
    <text x="324" y="95" font-size="18" fill="#f5f4da">sumbu rotasi</text>
  </g>
</svg>

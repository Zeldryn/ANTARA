  <g fill="#3a1b12" opacity="0.78">
    <ellipse cx="230" cy="300" rx="82" ry="45" transform="rotate(-18 230 300)"/>
    <ellipse cx="930" cy="575" rx="105" ry="57" transform="rotate(16 930 575)"/>
    <ellipse cx="555" cy="720" rx="72" ry="38" transform="rotate(-9 555 720)"/>
  </g>
  <rect width="1200" height="900" fill="url(#grain)"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff4d8">
    <text x="58" y="72" font-size="38" font-weight="700">ALPHA REGIO · TESSERA</text>
    <text x="58" y="112" font-size="21" opacity="0.9">Diagram morfologi lokal berdasarkan deskripsi NASA/JPL PIA00481</text>
    <text x="58" y="820" font-size="18" opacity="0.82">Punggungan + palung + lembah sesar saling berpotongan membentuk pola struktural kompleks.</text>
    <text x="58" y="853" font-size="16" opacity="0.68">Bukan citra NASA asli. Sumber ilmiah: NASA/JPL · Magellan · PIA00481.</text>
  </g>
</svg>

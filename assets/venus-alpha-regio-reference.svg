      <path d="M80 720 C245 610 355 515 500 455 S810 365 1135 275"/>
      <path d="M155 790 C285 700 390 620 560 555 S865 475 1100 395"/>
      <path d="M185 505 C310 455 405 385 510 300 S780 195 1010 130"/>
      <path d="M255 820 C375 735 480 690 650 625 S920 560 1125 500"/>
    </g>
    <g stroke="#4f2718" stroke-width="12" opacity="0.9">
      <path d="M190 140 C325 245 420 330 505 445 S690 670 915 820"/>
      <path d="M310 95 C425 225 515 320 595 420 S765 625 1030 760"/>
      <path d="M55 260 C210 340 315 415 410 530 S610 735 780 850"/>
      <path d="M460 70 C550 190 655 285 735 390 S900 590 1150 710"/>
    </g>
    <g stroke="#ffd287" stroke-width="3" opacity="0.55">
      <path d="M145 590 C260 525 350 455 430 385 S635 245 845 190"/>
      <path d="M235 670 C360 595 445 535 555 470 S780 350 1040 320"/>
      <path d="M280 250 C390 330 480 405 565 505 S735 675 925 785"/>
      <path d="M520 170 C620 265 690 350 780 465 S945 655 1100 740"/>

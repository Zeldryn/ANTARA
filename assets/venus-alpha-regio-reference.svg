<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Diagram morfologi Alpha Regio berdasarkan NASA/JPL PIA00481</title>
  <desc id="desc">Diagram lokal yang menekankan punggungan, palung, lembah sesar, dan pola tessera yang saling berpotongan di Alpha Regio. Bukan citra NASA asli.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d1c12"/>
      <stop offset="0.45" stop-color="#8b4d24"/>
      <stop offset="1" stop-color="#4a2416"/>
    </linearGradient>
    <radialGradient id="upland" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#e8b75f" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#b46e32" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#6d391f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r="1.4" fill="#ffcf7a" opacity="0.12"/>
      <circle cx="16" cy="14" r="1" fill="#2d140e" opacity="0.22"/>
      <circle cx="22" cy="4" r="0.8" fill="#ffd990" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="615" cy="455" rx="470" ry="315" fill="url(#upland)" filter="url(#soft)"/>
  <g fill="none" stroke-linecap="round" opacity="0.78">
    <g stroke="#efc170" stroke-width="8">
